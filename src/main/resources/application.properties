spring.application.name=AmazonClone

server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/amazon_clone?createDatabaseIfNotExist=true
spring.datasource.username=admin@amazonclone.com  
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Secret Key
jwt.secret=THIS_IS_A_SECRET_KEY_CHANGE_IT
jwt.expiration=86400000
